<text x="520.7" y="183.0" class="t1" font-size="12" text-anchor="start">61.9 %</text>
<path d="M230.0,192.0 H251.8 A4.0,4.0 0 0 1 255.8,196.0 V206.0 A4.0,4.0 0 0 1 251.8,210.0 H230.0 Z" class="p1"><title>Cortex-A53, 1.8 GHz, P1: 5.6 %</title></path>
<text x="261.8" y="205.0" class="t1" font-size="12" text-anchor="start" font-weight="600">5.6 %   (11× less)</text>
