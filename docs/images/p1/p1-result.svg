<path d="M230.0,228.0 H311.6 A4.0,4.0 0 0 1 315.6,232.0 V242.0 A4.0,4.0 0 0 1 311.6,246.0 H230.0 Z" class="today"><title>x86_64 development machine, today: 18.6 %</title></path>
<text x="321.6" y="241.0" class="t1" font-size="12" text-anchor="start">18.6 %</text>
<path d="M230.0,250.0 H233.0 A2.9899999999999998,2.9899999999999998 0 0 1 236.0,253.0 V265.0 A2.9899999999999998,2.9899999999999998 0 0 1 233.0,268.0 H230.0 Z" class="p1"><title>x86_64 development machine, P1: 1.3 %</title></path>
<text x="242.0" y="263.0" class="t1" font-size="12" text-anchor="start" font-weight="600">1.3 %   (15× less)</text>
<line x1="230.0" y1="104.0" x2="230.0" y2="276.0" class="axis" />
<text x="24.0" y="316.0" class="t3" font-size="11" text-anchor="start">Simulated: llvm-mca on the compiled loops. LLVM models the A73 with its Cortex-A57 model,</text>
<text x="24.0" y="331.0" class="t3" font-size="11" text-anchor="start">so read the A73 values as ±30–50 %; the ratios hold.</text>
</svg>
