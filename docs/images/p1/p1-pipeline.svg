<text x="24.0" y="104.0" class="t1" font-size="14" text-anchor="start" font-weight="600">Today</text>
<text x="24.0" y="121.0" class="t2" font-size="12" text-anchor="start">one output at a time:</text>
<text x="24.0" y="136.0" class="t2" font-size="12" text-anchor="start">each add needs</text>
<text x="24.0" y="151.0" class="t2" font-size="12" text-anchor="start">the previous sum</text>
