.cell{fill:#262624;stroke:#44443f}.cellHi{fill:#1d3a5f;stroke:#3987e5}.cellOld{fill:#2f2f2c;stroke:#4a4a46}
.arrow{fill:#9a9993}
}
</style>
<rect class="bg" x="0.5" y="0.5" width="859" height="419" rx="8"/>
<text x="24.0" y="34.0" class="t1" font-size="17" text-anchor="start" font-weight="600">Why the CPU waits today, and how P1 keeps it busy</text>
<text x="24.0" y="56.0" class="t2" font-size="13" text-anchor="start">The same 20 clock cycles. A multiply-add's result is ready about 5 cycles after it starts.</text>
