<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="title desc">
<title id="title">Why the CPU waits today, and how P1 keeps it busy</title>
<desc id="desc">Timeline of 20 clock cycles. Today: one multiply-add starts every 5 cycles because each needs the previous sum: 4 in 20 cycles. P1: four independent registers of four lanes start one 4-wide multiply-add almost every cycle: 64 in 20 cycles.</desc>
<style>
