<svg xmlns="http://www.w3.org/2000/svg" width="760" height="384" viewBox="0 0 760 384" role="img" aria-labelledby="title desc">
<title id="title">P1: one tap, sixteen outputs</title>
<desc id="desc">For each tap k, the 16 samples x[n-k] to x[n+15-k] are multiplied by h[k] and added into 16 running sums held in four NEON registers a0 to a3 of four lanes, one sum per output y[n] to y[n+15].</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
.bg{fill:#fcfcfb;stroke:#e4e3df}
.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#7a7975}
.grid{stroke:#ebeae6;stroke-width:1}.axis{stroke:#c9c8c2;stroke-width:1}.ref{stroke:#7a7975;stroke-width:1}
.today{fill:#eb6834}.p1{fill:#2a78d6}.alt{fill:#b4b3ad}
.todayS{stroke:#eb6834}.p1S{stroke:#2a78d6}.lineS{stroke:#7a7975}
.cell{fill:#f0efec;stroke:#d6d5d0}.cellHi{fill:#d9e7f8;stroke:#2a78d6}.cellOld{fill:#e6e5e1;stroke:#c9c8c2}
.arrow{fill:#7a7975}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19;stroke:#383835}
.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#9a9993}
.grid{stroke:#2b2b29}.axis{stroke:#4a4a46}.ref{stroke:#9a9993}
.today{fill:#d95926}.p1{fill:#3987e5}.alt{fill:#5f5e5a}
.todayS{stroke:#d95926}.p1S{stroke:#3987e5}.lineS{stroke:#9a9993}
.cell{fill:#262624;stroke:#44443f}.cellHi{fill:#1d3a5f;stroke:#3987e5}.cellOld{fill:#2f2f2c;stroke:#4a4a46}
.arrow{fill:#9a9993}
}
</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="383" rx="8"/>
<text x="24.0" y="34.0" class="t1" font-size="17" text-anchor="start" font-weight="600">P1: one tap, sixteen outputs</text>
<text x="24.0" y="56.0" class="t2" font-size="13" text-anchor="start">For tap k: load 16 neighbouring samples, multiply all by the same coefficient h[k], add into 16 sums.</text>
<defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs>
<text x="56.0" y="84.0" class="t2" font-size="12" text-anchor="start">input samples x[ ]</text>
<rect x="56" y="92" width="32" height="28" rx="3" class="cell"/>
<text x="72.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n−3</text>
<rect x="90" y="92" width="32" height="28" rx="3" class="cell"/>
<text x="106.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n−2</text>
<rect x="124" y="92" width="32" height="28" rx="3" class="cell"/>
<text x="140.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n−1</text>
<rect x="158" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="174.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n</text>
<rect x="192" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="208.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+1</text>
<rect x="226" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="242.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+2</text>
<rect x="260" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="276.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+3</text>
<rect x="294" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="310.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+4</text>
<rect x="328" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="344.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+5</text>
<rect x="362" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="378.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+6</text>
<rect x="396" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="412.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+7</text>
<rect x="430" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="446.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+8</text>
<rect x="464" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="480.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+9</text>
<rect x="498" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="514.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+10</text>
<rect x="532" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="548.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+11</text>
<rect x="566" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="582.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+12</text>
<rect x="600" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="616.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+13</text>
<rect x="634" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="650.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+14</text>
<rect x="668" y="92" width="32" height="28" rx="3" class="cellHi"/>
<text x="684.0" y="110.0" class="t1 mono" font-size="10" text-anchor="middle">n+15</text>
<path d="M158,128 V134 H700 V128" fill="none" class="p1S" stroke-width="2" opacity="1.0"/>
<text x="429.0" y="152.0" class="t1" font-size="12" text-anchor="middle">tap 0:  16 samples × h[0]</text>
<path d="M124,164 V170 H666 V164" fill="none" class="p1S" stroke-width="2" opacity="0.55"/>
<text x="395.0" y="188.0" class="t1" font-size="12" text-anchor="middle">tap 1:  the same 16 shifted by one,  × h[1]</text>
<text x="413.0" y="210.0" class="t2" font-size="12" text-anchor="middle">…  and so on, to tap 2000</text>
<path d="M209.0,218 V236" class="lineS" stroke-width="1.5" marker-end="url(#ah2)"/>
<path d="M345.0,218 V236" class="lineS" stroke-width="1.5" marker-end="url(#ah2)"/>
<path d="M481.0,218 V236" class="lineS" stroke-width="1.5" marker-end="url(#ah2)"/>
<path d="M617.0,218 V236" class="lineS" stroke-width="1.5" marker-end="url(#ah2)"/>
<rect x="158" y="244" width="134" height="34" rx="4" class="p1" opacity="0.18"/>
<rect x="158" y="244" width="134" height="34" rx="4" fill="none" class="p1S" stroke-width="1.5"/>
<line x1="191.0" y1="248.0" x2="191.0" y2="274.0" class="axis" />
<line x1="225.0" y1="248.0" x2="225.0" y2="274.0" class="axis" />
<line x1="259.0" y1="248.0" x2="259.0" y2="274.0" class="axis" />
<text x="174.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n</text>
<text x="208.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+1</text>
<text x="242.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+2</text>
<text x="276.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+3</text>
<text x="225.0" y="298.0" class="t2 mono" font-size="11" text-anchor="middle">register a0</text>
<rect x="294" y="244" width="134" height="34" rx="4" class="p1" opacity="0.18"/>
<rect x="294" y="244" width="134" height="34" rx="4" fill="none" class="p1S" stroke-width="1.5"/>
<line x1="327.0" y1="248.0" x2="327.0" y2="274.0" class="axis" />
<line x1="361.0" y1="248.0" x2="361.0" y2="274.0" class="axis" />
<line x1="395.0" y1="248.0" x2="395.0" y2="274.0" class="axis" />
<text x="310.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+4</text>
<text x="344.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+5</text>
<text x="378.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+6</text>
<text x="412.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+7</text>
<text x="361.0" y="298.0" class="t2 mono" font-size="11" text-anchor="middle">register a1</text>
<rect x="430" y="244" width="134" height="34" rx="4" class="p1" opacity="0.18"/>
<rect x="430" y="244" width="134" height="34" rx="4" fill="none" class="p1S" stroke-width="1.5"/>
<line x1="463.0" y1="248.0" x2="463.0" y2="274.0" class="axis" />
<line x1="497.0" y1="248.0" x2="497.0" y2="274.0" class="axis" />
<line x1="531.0" y1="248.0" x2="531.0" y2="274.0" class="axis" />
<text x="446.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+8</text>
<text x="480.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+9</text>
<text x="514.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+10</text>
<text x="548.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+11</text>
<text x="497.0" y="298.0" class="t2 mono" font-size="11" text-anchor="middle">register a2</text>
<rect x="566" y="244" width="134" height="34" rx="4" class="p1" opacity="0.18"/>
<rect x="566" y="244" width="134" height="34" rx="4" fill="none" class="p1S" stroke-width="1.5"/>
<line x1="599.0" y1="248.0" x2="599.0" y2="274.0" class="axis" />
<line x1="633.0" y1="248.0" x2="633.0" y2="274.0" class="axis" />
<line x1="667.0" y1="248.0" x2="667.0" y2="274.0" class="axis" />
<text x="582.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+12</text>
<text x="616.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+13</text>
<text x="650.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+14</text>
<text x="684.0" y="265.0" class="t1 mono" font-size="10" text-anchor="middle">n+15</text>
<text x="633.0" y="298.0" class="t2 mono" font-size="11" text-anchor="middle">register a3</text>
<text x="24.0" y="258.0" class="t2" font-size="12" text-anchor="start">16 sums:</text>
<text x="24.0" y="273.0" class="t2 mono" font-size="12" text-anchor="start">y[ ]</text>
<text x="24.0" y="334.0" class="t1" font-size="12" text-anchor="start">Each sum still adds its taps in order 0, 1, 2 … 2000, as today. Only which outputs run side by side changed.</text>
<text x="24.0" y="352.0" class="t2" font-size="12" text-anchor="start">After the last tap the 16 outputs are stored and the next 16 start. Per tap: 4 loads, 1 broadcast of h[k],</text>
<text x="24.0" y="368.0" class="t2" font-size="12" text-anchor="start">4 fused multiply-adds of 4 lanes each.</text>
</svg>
