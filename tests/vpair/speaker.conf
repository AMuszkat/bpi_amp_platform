# PipeWire daemon configuration for one virtual speaker of the virtual pair.
#
# A real speaker plays into the MAX98397 amplifiers through bpi-alsa-playback-pcm. A virtual
# speaker has a null sink called "amplifier" instead, with the same two channels (woofer and
# tweeter, as FL and FR), driven by its own clock at the board's quantum. The harness records
# that sink's monitor to see exactly what the amplifiers would have received.

context.properties = {
    core.daemon = true
    core.name   = pipewire-0
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 32
    mem.allow-mlock = false
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    # Grants clients their permissions. Without it a client connects but is never answered:
    # with no session manager granting permissions, every pw-cli/pw-dump call just hangs.
    { name = libpipewire-module-access }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }
]

context.objects = [
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "amplifier"
          node.description = "Virtual amplifier (woofer = FL, tweeter = FR)"
          media.class      = "Audio/Sink"
          audio.position   = [ FL FR ]
          node.driver      = true
          monitor.channel-volumes = false
      }
    }
]
