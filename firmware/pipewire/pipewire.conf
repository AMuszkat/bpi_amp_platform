# Daemon config file for PipeWire version "0.3.65" #
#
# Copy and edit this file in /etc/pipewire for system-wide changes
# or in ~/.config/pipewire for local changes.
#
# It is also possible to place a file with an updated section in
# /etc/pipewire/pipewire.conf.d/ for system-wide changes or in
# ~/.config/pipewire/pipewire.conf.d/ for local changes.
#
# The BPI AMP Platform's PipeWire configuration (firmware/pipewire/pipewire.conf), which
# firmware/setup.sh --base-conf installs as ~/.config/pipewire/pipewire.conf: the measured
# board's own configuration, with the quantum's default and range, the converter quality and the
# speakerd sink in this one file (firmware/CLAUDE.md, "Rates" and "speakerd on a board").
#

context.properties = {
    ## Configure properties in the system.
    #library.name.system                   = support/libspa-support
    #context.data-loop.library.name.system = support/libspa-support
    #support.dbus                          = true
    #link.max-buffers                      = 64
    link.max-buffers                       = 16                       # version < 3 clients can't handle more
    #mem.warn-mlock                        = false
    mem.allow-mlock                       = true
    mem.mlock-all                         = true
    #clock.power-of-two-quantum            = true
    log.level                             = 3
    #cpu.zero.denormals                    = false

    # The converter quality of the daemon's own nodes (the amplifier's).
    resample.quality = 15

    core.daemon = true              # listening for socket connections
    core.name   = pipewire-0        # core name and socket name

    ## Properties for the DSP configuration.
    # 48000 Hz: the rate snapcast streams (snapcast-setup.sh --sampleformat 48000:32:2) and the
    # shipped crossover and firConv filters are designed for. The amplifier's audio.rate below
    # follows it (setup.sh --base-conf --rate rewrites the three together).
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    # The quantum (the buffer size) is 512 unless the controller chooses another: the chain
    # document's "quantum", 64 to 2048, which speakerd forces with the settings metadata's
    # clock.force-quantum (a document with none: 512). min and max are that range; speakerd
    # prepares its plugins for max-quantum (2048), so any size chosen only re-primes the graph.
    default.clock.quantum       = 512
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 2048
    #default.clock.quantum-limit = 8192
    #default.video.width         = 640
    #default.video.height        = 480
    #default.video.rate.num      = 25
    #default.video.rate.denom    = 1
    #
    #settings.check-quantum      = false
    #settings.check-rate         = false
}

context.spa-libs = {
    #<factory-name regex> = <library-name>
    #
    # Used to find spa factory names. It maps an spa factory name
    # regular expression to a library name that should contain
    # that factory.
    #
    audio.convert.* = audioconvert/libspa-audioconvert
    avb.*           = avb/libspa-avb
    api.alsa.*      = alsa/libspa-alsa
    api.v4l2.*      = v4l2/libspa-v4l2
    api.libcamera.* = libcamera/libspa-libcamera
    api.bluez5.*    = bluez5/libspa-bluez5
    api.vulkan.*    = vulkan/libspa-vulkan
    api.jack.*      = jack/libspa-jack
    support.*       = support/libspa-support
    #videotestsrc   = videotestsrc/libspa-videotestsrc
    #audiotestsrc   = audiotestsrc/libspa-audiotestsrc
}

context.modules = [
    #{ name = <module-name>
    #    [ args  = { <key> = <value> ... } ]
    #    [ flags = [ [ ifexists ] [ nofail ] ]
    #}
    #
    # Loads a module with the given parameters.
    # If ifexists is given, the module is ignored when it is not found.
    # If nofail is given, module initialization failures are ignored.
    #

    # Uses realtime scheduling to boost the audio thread priorities. This uses
    # RTKit if the user doesn't have permission to use regular realtime
    # scheduling.
    { name = libpipewire-module-rt
        args = {
            nice.level    = -11
            rt.prio      = 88
            rt.time.soft = -1
            rt.time.hard = -1
        }
        flags = [ ifexists nofail ]
    }

    # The native communication protocol.
    { name = libpipewire-module-protocol-native }

    # The profile module. Allows application to access profiler
    # and performance data. It provides an interface that is used
    # by pw-top and pw-profiler.
    { name = libpipewire-module-profiler }

    # Allows applications to create metadata objects. It creates
    # a factory for Metadata objects.
    { name = libpipewire-module-metadata }

    # Creates a factory for making devices that run in the
    # context of the PipeWire server.
    { name = libpipewire-module-spa-device-factory }

    # Creates a factory for making nodes that run in the
    # context of the PipeWire server.
    { name = libpipewire-module-spa-node-factory }

    # Allows creating nodes that run in the context of the
    # client. Is used by all clients that want to provide
    # data to PipeWire.
    { name = libpipewire-module-client-node }

    # Allows creating devices that run in the context of the
    # client. Is used by the session manager.
    { name = libpipewire-module-client-device }

    # The portal module monitors the PID of the portal process
    # and tags connections with the same PID as portal
    # connections.
    { name = libpipewire-module-portal
        flags = [ ifexists nofail ]
    }

    # The access module can perform access checks and block
    # new clients.
    { name = libpipewire-module-access
        args = {
            # access.allowed to list an array of paths of allowed
            # apps.
            # access.allowed = [
            #    /usr/bin/pipewire-media-session
            # ]

            # An array of rejected paths.
            #access.rejected = [ ]

            # An array of paths with restricted access.
            #access.restricted = [ ]

            # Anything not in the above lists gets assigned the
            # access.force permission.
            #access.force = flatpak
        }
    }

    # Makes a factory for wrapping nodes in an adapter with a
    # converter and resampler.
    { name = libpipewire-module-adapter }

    # Makes a factory for creating links between ports.
    { name = libpipewire-module-link-factory }

    # Provides factories to make session manager objects.
    { name = libpipewire-module-session-manager }

    # Use libcanberra to play X11 Bell
    # { name = libpipewire-module-x11-bell
    #     args = {
    #         #sink.name = ""
    #         #sample.name = "bell-window-system"
    #         #x11.display = null
    #         #x11.xauthority = null
    #     }
    #     flags = [ ifexists nofail ]
    # }

    # Ap.cap -> Ap.play: there from boot, so a player routed with --route plugin-host
    # (snapcast-setup.sh) always has its target; Ap.play feeds an AudioPluginHost's input.
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Ap.sink.loopback"
            capture.props = {
                node.name = "Ap.cap"
                media.class = "Stream/Input/Audio"
                node.autoconnect = false
            }
            playback.props = {
                target.object = "ALSA Capture"
                node.name = "Ap.play"
                media.class = "Stream/Output/Audio"
                node.autoconnect = false
            }
        }
    }
]

context.objects = [
    #{ factory = <factory-name>
    #    [ args  = { <key> = <value> ... } ]
    #    [ flags = [ [ nofail ] ]
    #}
    #
    # Creates an object from a PipeWire factory with the given parameters.
    # If nofail is given, errors are ignored (and no object is created).
    #
    #{ factory = spa-node-factory   args = { factory.name = videotestsrc node.name = videotestsrc Spa:Pod:Object:Param:Props:patternType = 1 } }
    #{ factory = spa-device-factory args = { factory.name = api.jack.device foo=bar } flags = [ nofail ] }
    #{ factory = spa-device-factory args = { factory.name = api.alsa.enum.udev } }
    #{ factory = spa-node-factory   args = { factory.name = api.alsa.seq.bridge node.name = Internal-MIDI-Bridge } }
    #{ factory = adapter            args = { factory.name = audiotestsrc node.name = my-test } }
    #{ factory = spa-node-factory   args = { factory.name = api.vulkan.compute.source node.name = my-compute-source } }

    # A default dummy driver. This handles nodes marked with the "node.always-driver"
    # property when no other driver is currently active. JACK clients need this.
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Dummy-Driver
            node.group      = pipewire.dummy
            priority.driver = 20000
        }
    }
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Freewheel-Driver
            priority.driver = 19000
            node.group      = pipewire.freewheel
            node.freewheel  = true
        }
    }
    # This creates a single PCM source device for the given
    # alsa device path hw:0. You can change source to sink
    # to make a sink in the same way.
    # { factory = adapter
    #    args = {
    #        factory.name           = api.alsa.pcm.source
    #        node.name              = "alsa-source"
    #        node.description       = "PCM Source test"
    #        media.class            = "Audio/Source"
    #        api.alsa.path          = "hw:0"
    #        api.alsa.period-size   = 1024
    #        api.alsa.headroom      = 0
    #        api.alsa.disable-mmap  = false
    #        api.alsa.disable-batch = false
    #        audio.format           = "S16LE"
    #        audio.rate             = 44100
    #        audio.channels         = 2
    #        audio.position         = "FL,FR"
    #    }
    # }

    # The amplifier. No audio.position: its ports are playback_1 .. playback_8.
    # audio.rate: the graph's, so PipeWire does not resample what it plays to the DAC.
    # priority.driver: the DAC drives every graph it is in; the speakerd sink below, a null
    # sink at 0, would tie with an amplifier without one. 1000 is what WirePlumber gives the
    # first ALSA playback device it finds.
    { factory = adapter
       args = {
           factory.name           = api.alsa.pcm.sink
           node.name              = "bpi-alsa-playback-pcm"
           node.description       = "BPI Playback Device"
           node.autoconnect       = false
           media.class            = "Audio/Sink"
           api.alsa.path          = "hw:BPICM4IO"
           audio.format           = "S32LE"
           audio.rate             = 48000
           priority.driver        = 1000
           #audio.channels = 2
       }
    }

    # The speakerd input sink, there from the moment PipeWire starts, after the amplifier.
    # Players play into it; speakerd reads its monitor ports and plays to the amplifier, and
    # adopts a sink of this name. Were it missing, WirePlumber would send a player to the
    # default sink, the amplifier, full range (dsp/juce_apps/speakerd/README.md, "Whose sink").
    # A null sink is always a driver: priority.driver 0, the lowest there is (not negative:
    # PipeWire 0.3.65 compares it as if unsigned), so it never drives while the amplifier is
    # in the graph. priority.session 1500, above any ALSA sink's, makes it WirePlumber's default
    # sink. The same sink as pipewire.conf.d/60-speakerd-sink.conf, which the installers do not
    # install beside this file (two speakerd nodes otherwise).
    { factory = adapter
      args = {
          factory.name            = support.null-audio-sink
          node.name               = "speakerd"
          node.description        = "speakerd input"
          media.class             = "Audio/Sink"
          audio.position          = [ FL FR ]
          # What the monitor carries is exactly what was played.
          monitor.channel-volumes = false
          priority.driver         = 0
          priority.session        = 1500
      }
    }
]

context.exec = [
    #{ path = <program-name> [ args = "<arguments>" ] }
    #
    # Execute the given program with arguments.
    #
    # You can optionally start the session manager here,
    # but it is better to start it as a systemd service.
    # Run the session manager with -h for options.
    #
    #{ path = "/usr/bin/pipewire-media-session" args = "" }
    #
    # You can optionally start the pulseaudio-server here as well
    # but it is better to start it as a systemd service.
    # It can be interesting to start another daemon here that listens
    # on another address with the -a option (eg. -a tcp:4713).
    #
    #{ path = "/usr/bin/pipewire" args = "-c pipewire-pulse.conf" }
]
