# The speakerd input sink, there from the moment PipeWire starts (BPI AMP Platform).
#
# Installed by firmware/speakerd-setup.sh as
#     ~/.config/pipewire/pipewire.conf.d/60-speakerd-sink.conf
# and removed by its uninstall; see firmware/CLAUDE.md, "speakerd on a board".
#
# Players (snapclient, shairport-sync) play into this sink, and speakerd reads its monitor
# ports and plays to the amplifier. It has to exist before speakerd runs and between its
# restarts: were it missing, WirePlumber would send a player to the default sink, the
# amplifier, full range and at full level, tweeter included
# (dsp/juce_apps/speakerd/README.md, "Whose sink"). speakerd adopts a sink of this name.
#
# A null sink is always a driver, and this one must never drive the graph while the
# amplifier exists: its timer would clock the DAC's graph, and the two drift. PipeWire gives a
# group of linked nodes to the driver with the highest priority.driver, so this sink has the
# lowest there is, 0. Not a negative number: PipeWire 0.3.65 compares priority.driver as if
# unsigned, and a sink at -1 drives an amplifier at 1 (measured on the virtual pair). The
# amplifier needs a priority.driver above 0; at 0 it ties, and drives only because it was
# created first (firmware/pipewire/pipewire.conf gives it 1000). With the amplifier gone,
# this sink drives its players on its own, so a stream keeps going into silence.
#
# Its priority.session is above any ALSA sink's, so WirePlumber makes it the default sink:
# a stream with no target of its own then plays through speakerd, never straight into the
# amplifier (unless a person chose another default with wpctl, which WirePlumber keeps).

context.objects = [
    { factory = adapter
      args = {
          factory.name            = support.null-audio-sink
          node.name               = "speakerd"
          node.description        = "speakerd input"
          media.class             = "Audio/Sink"
          audio.position          = [ FL FR ]
          # What the monitor carries is exactly what was played.
          monitor.channel-volumes = false
          priority.driver         = 0
          priority.session        = 1500
      }
    }
]
